services:
  default:
    image: python:3.12-slim
    init: true
    command: tail -f /dev/null
    network_mode: none
    cpus: 1.0
    mem_limit: 512m
    volumes:
      - harness-code:/harness
      - workspace-code:/workspace
  helper:
    image: python:3.12-slim
    init: true
    command: tail -f /dev/null
    network_mode: none
    cpus: 1.0
    mem_limit: 512m
    volumes:
      - harness-code:/harness
      - workspace-code:/workspace

volumes:
  harness-code:
  workspace-code:
